# Application
spring.application.name=Student CRUD

# MySQL datasource
spring.datasource.url=jdbc:mysql://localhost:3306/universitydb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# JWT (replace value with a secure key for production)
jwt.secret=replace-with-a-very-secure-secret-at-least-32-bytes
jwt.expiration-ms=3600000
