# Application
spring.application.name=Student CRUD

# PostgreSQL datasource
spring.datasource.url=jdbc:postgresql://localhost:5432/universitydb
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=postgres

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT (replace value with a secure key for production)
jwt.secret=replace-with-a-very-secure-secret-at-least-32-bytes
jwt.expiration-ms=3600000
