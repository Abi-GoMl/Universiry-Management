# Application
spring.application.name=Student CRUD

# MySQL datasource (use environment variables in production)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/universitydb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:root}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# JWT secret loaded from env (fallback to a placeholder)
jwt.secret=${JWT_SECRET:replace-with-a-very-secure-secret-at-least-32-bytes}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
