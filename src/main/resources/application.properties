# Application
spring.application.name=Student CRUD

# Use H2 embedded file DB so data survives restart (file-based)
spring.datasource.url=jdbc:h2:file:./data/universitydb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT (replace value with a secure key for production)
jwt.secret=replace-with-a-very-secure-secret-at-least-32-bytes
jwt.expiration-ms=3600000
